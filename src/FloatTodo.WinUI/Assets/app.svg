<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 浅钛灰底板细微渐变 -->
    <linearGradient id="bodyGrad" x1="256" y1="40" x2="256" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F6F7F9"/>
      <stop offset="100%" stop-color="#E5E8EC"/>
    </linearGradient>

    <!-- 亮橙磁吸胶囊渐变 -->
    <linearGradient id="pillGrad" x1="256" y1="216" x2="256" y2="296" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6326"/>
      <stop offset="100%" stop-color="#F54A00"/>
    </linearGradient>

    <!-- 微凹槽阴影 -->
    <linearGradient id="slotGrad" x1="256" y1="210" x2="256" y2="302" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D9DCE1"/>
      <stop offset="100%" stop-color="#EFF1F4"/>
    </linearGradient>
  </defs>

  <!-- 底板：432x432 Squircle，圆角108 -->
  <rect x="40" y="40" width="432" height="432" rx="108" fill="url(#bodyGrad)" stroke="#D0D4DC" stroke-width="2"/>

  <!-- 工业微凹槽：256x92，圆角46 -->
  <rect x="128" y="210" width="256" height="92" rx="46" fill="url(#slotGrad)"/>

  <!-- 亮橙磁吸胶囊横条：240x80，圆角40 -->
  <rect x="136" y="216" width="240" height="80" rx="40" fill="url(#pillGrad)"/>
</svg>
